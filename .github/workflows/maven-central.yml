# 把 kheti 的三个库模块发布到 Maven Central，并转入 Central Portal 待人工 Publish。
#
# ## 为什么不覆盖、必须升版本
# Maven Central 的版本是**不可变的**（官方 Immutability 要求）：0.1.0 发出去就永久占用，
# 不能重复发布、不能覆盖。因此本 workflow 有"版本门禁"：
#   - 目标版本已在 Central 上 → 跳过库发布（APK 仍会更新，由 sample-apk.yml 负责）
#   - 版本不存在             → 才执行 ./gradlew publish
#
# ## 触发
#   - push 到 master 且构建相关文件变更（与 sample-apk.yml 相同的 paths）
#   - 手动触发，可选：
#       dry_run       只验证流程与 CI 凭据，不上传（默认）
#       auto_release  校验通过后自动 Publish（不可逆，慎用）
#
# ## 发布的最终一步默认由人工确认
# Gradle 内置 maven-publish 只把文件 PUT 到 staging，随后必须补一次 Portal 接口调用，
# 部署才会出现在 Portal。本 workflow 默认 publishing_type=user_managed：
# 自动完成"上传 + 转入 Portal"，但**点 Publish 进入 Maven Central 由人决定**（不可逆）。
# 确需全自动时，手动触发选 auto_release=true（publishing_type=automatic）。

name: Maven Central Release

on:
  push:
    branches: [master]
    paths:
      - "kheti-core/**"
      - "kheti-layout/**"
      - "kheti-compose/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只验证流程与 CI 凭据，不上传到 Maven Central"
        type: boolean
        default: false
      auto_release:
        description: "校验通过后自动 Publish 到 Maven Central（不可逆，版本不可覆盖）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # macOS：桌面测试断言依赖平台默认 CJK 字体的折行/行宽，Linux runner 无 CJK 字体
    # 时 5 项测试不成立（Phase2PoetryTest 3 项、Phase3VerticalTest 2 项）。
    # macOS 与本机已验证的环境一致，也是 iOS 目标（Kotlin/Native）的自然宿主。
    runs-on: macos-latest
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^kheti.version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Version gate — skip if already on Maven Central
        id: gate
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            "https://repo1.maven.org/maven2/io/github/iamkings/kheti-core/${V}/kheti-core-${V}.pom")
          echo "Maven Central 上 kheti-core ${V} 的 POM 状态：$CODE"
          if [ "$CODE" = "200" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              # dry_run 不上传，可以安全地继续走完整流程（用 publishToMavenLocal）
              echo "::notice::版本 ${V} 已在 Central；dry_run 下继续走流程以验证 CI 凭据"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::版本 ${V} 已发布到 Maven Central（版本不可覆盖），跳过库发布"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$CODE" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "版本 ${V} 尚未发布 → 继续库发布"
          else
            echo "::warning::repo1.maven.org 返回 $CODE（可能是网络抖动），按未发布处理"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 发布不可逆，先过测试；同时这一步会暴露 CI 上才出现的问题（如缺少密钥）
      - name: Tests
        if: steps.gate.outputs.skip == 'false'
        run: >
          ./gradlew :kheti-core:desktopTest :kheti-layout:desktopTest
          :kheti-compose:desktopTest --stacktrace

      # 发布前预检：真实执行一次签名（产物只在本地 build 目录，不上传）。
      # 若 SIGNING_KEY 缺失/无效，这里会**立刻**失败，而不是让未签名构件进 staging。
      - name: Preflight — sign one publication
        if: steps.gate.outputs.skip == 'false'
        run: ./gradlew :kheti-compose:signDesktopPublication --stacktrace

      # dry_run 用 publishToMavenLocal 走**完整的发布任务图**（含签名与依赖解析），
      # 但完全不碰 Central —— 用于验证 CI 凭据与流程，不产生不可逆发布
      - name: Publish library (dry run → mavenLocal)
        if: steps.gate.outputs.skip == 'false' && inputs.dry_run == true
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Publish library to Maven Central (staging)
        if: steps.gate.outputs.skip == 'false' && inputs.dry_run != true
        run: ./gradlew publish --stacktrace

      - name: Transfer deployment to Central Portal
        if: steps.gate.outputs.skip == 'false' && inputs.dry_run != true
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64)
          NS=io.github.iamkings
          TYPE=user_managed
          if [ "${{ inputs.auto_release }}" = "true" ]; then
            TYPE=automatic
            echo "::warning::auto_release=true：校验通过后将自动 Publish（不可逆）"
          fi
          echo "转入 Portal（publishing_type=$TYPE）…"
          RESP=$(curl -s -m 300 -X POST -H "Authorization: Bearer $TOKEN" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${NS}?publishing_type=${TYPE}")
          echo "$RESP"
          if echo "$RESP" | grep -q '"error"'; then
            # staging 仓库按创建者 IP 隔离；若默认端点找不到（IP 漂移），改用跨 IP 的 key 端点
            echo "::warning::默认端点失败 → 改用跨 IP 的 key 端点"
            KEY=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=${NS}" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['repositories'][0]['key'])")
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$KEY")
            curl -s -m 300 -X POST -H "Authorization: Bearer $TOKEN" \
              "https://ossrh-staging-api.central.sonatype.com/manual/upload/repository/${ENC}?publishing_type=${TYPE}"
            echo
          else
            echo "✓ 已转入 Central Portal，请到 https://central.sonatype.com/publishing 确认并 Publish"
          fi

      - name: Summary (skipped)
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "::notice::版本 ${{ steps.ver.outputs.version }} 已在 Maven Central，本次未重复发布。"
          echo "更新示例 APK 由 sample-apk workflow 负责。"

      - name: Summary (dry run)
        if: steps.gate.outputs.skip == 'false' && inputs.dry_run == true
        run: |
          echo "::notice::dry_run：凭据与签名预检均通过，未执行上传。"
          echo "真正发布时把 dry_run 留空（push 触发即发布）。"
